name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Same trimmed Release publish as the release workflow, so trimming
      # and publish-only problems show up before a tag is pushed.
      - name: Publish (Release)
        run: dotnet publish UsdMxn.csproj -c Release -o publish
